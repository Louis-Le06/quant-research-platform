# Run the whole stack locally:  docker compose up --build
# Dashboard: http://localhost:8050   API docs: http://localhost:8000/docs
services:
  quant-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: quant-api:latest
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: "1.0.0-compose"

  quant-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    image: quant-dashboard:latest
    ports:
      - "8050:8050"
    environment:
      API_URL: http://quant-api:8000
    depends_on:
      quant-api:
        condition: service_healthy
