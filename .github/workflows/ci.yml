name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write          # publish test results as GitHub Checks
  pull-requests: write   # comment test summary on PRs

jobs:
  # ------------------------------------------------------------------
  lint:
    name: Lint & format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: clang-format (C++)
        run: |
          find engine \( -name '*.cpp' -o -name '*.hpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: cppcheck (C++ static analysis)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
          cppcheck --enable=warning,performance,portability --std=c++17 \
                   --error-exitcode=1 --inline-suppr -I engine/include engine/src

      - name: ruff (Python lint + format)
        run: |
          pip install ruff==0.17.4
          ruff check api dashboard
          ruff format --check api dashboard

  # ------------------------------------------------------------------
  engine:
    name: C++ engine — GoogleTest (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compiler: gcc,   cc: gcc,   cxx: g++ }
          - { compiler: clang, cc: clang, cxx: clang++ }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache GoogleTest
        uses: actions/cache@v4
        with:
          path: engine/build/_deps
          key: gtest-${{ matrix.compiler }}-${{ hashFiles('engine/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S engine -B engine/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build engine/build -j"$(nproc)"

      - name: Run GoogleTest
        run: |
          mkdir -p test-results
          ./engine/build/engine_tests \
            --gtest_output=xml:test-results/gtest-${{ matrix.compiler }}.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtest-results-${{ matrix.compiler }}
          path: test-results/

      - name: Publish GoogleTest report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: test-results/*.xml
          check_name: GoogleTest (${{ matrix.compiler }})
          include_passed: true
          detailed_summary: true

  # ------------------------------------------------------------------
  python:
    name: Python — pytest (API + dashboard)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements*.txt
            dashboard/requirements*.txt

      - name: Build & install C++ engine (pybind11)
        run: pip install ./engine

      - name: Install dependencies
        run: |
          pip install -r api/requirements-dev.txt
          pip install -r dashboard/requirements-dev.txt

      # Run separately: both suites have a top-level module named `app`
      - name: API tests
        run: pytest api/tests --junitxml=test-results/pytest-api.xml -v

      - name: Dashboard tests
        run: pytest dashboard/tests --junitxml=test-results/pytest-dashboard.xml -v

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: test-results/

      - name: Publish pytest report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: test-results/*.xml
          check_name: pytest
          include_passed: true
          detailed_summary: true

  # ------------------------------------------------------------------
  docker-build:
    name: Docker build check (${{ matrix.image }})
    runs-on: ubuntu-24.04
    needs: [engine, python]
    strategy:
      matrix:
        image: [api, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.image }} image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
