# Dependabot opens weekly dependency-update PRs (also good review practice).
version: 2
updates:
  - package-ecosystem: pip
    directory: /api
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /dashboard
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /api
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /dashboard
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
