apiVersion: apps/v1
kind: Deployment
metadata:
  name: quant-api
  namespace: quant
  labels:
    app: quant-api
    app.kubernetes.io/part-of: quant-research-platform
spec:
  replicas: 2            # stateless API -> scales horizontally
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: quant-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: quant-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          # Built locally and loaded into Minikube -> never pulled from a registry
          image: quant-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: APP_VERSION
              valueFrom:
                configMapKeyRef:
                  name: quant-config
                  key: APP_VERSION
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: quant-api
  namespace: quant
spec:
  type: ClusterIP        # internal only (called by the dashboard)
  selector:
    app: quant-api
  ports:
    - name: http
      port: 8000
      targetPort: http
